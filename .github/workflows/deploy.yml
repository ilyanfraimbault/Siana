name: Deploy

on:
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/siana-bot
  TAG: ${{ github.event.release.tag_name }}

jobs:
  deploy:
    name: Build and deploy ${{ github.event.release.tag_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Require the deployment configuration
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY }}
          HOSTINGER_VM_ID: ${{ vars.HOSTINGER_VM_ID }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          set -uo pipefail
          missing=""
          for name in HOSTINGER_API_KEY HOSTINGER_VM_ID DISCORD_TOKEN; do
            if [ -z "${!name}" ]; then
              missing="${missing} ${name}"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Incomplete deployment configuration:${missing}. Set the missing secrets/variables (README) and re-run."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./src/SianaBot
          push: true
          cache-from: type=gha,scope=siana-bot
          cache-to: type=gha,mode=max,scope=siana-bot
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ github.event.release.prerelease && format('{0}:prerelease', env.IMAGE) || format('{0}:latest', env.IMAGE) }}

      # Les pre-releases publient une image mais ne touchent pas au VPS.
      - name: Redeploy Docker Manager project
        if: ${{ !github.event.release.prerelease }}
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ vars.HOSTINGER_VM_ID }}
          project-name: siana
          docker-compose-path: compose.prod.yaml
          environment-variables: |
            DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}
            IMAGE_TAG=${{ env.TAG }}
