name: Bug
description: Le bot ne fait pas ce qu'il devrait
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Ce qui se passe
      description: La commande utilisée, la réponse du bot, une capture si besoin.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ce qui devrait se passer
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. /reactionrole add ...
        2. Réagir avec ...
