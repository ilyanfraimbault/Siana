services:
  bot:
    image: ghcr.io/ilyanfraimbault/siana-bot:${IMAGE_TAG:-latest}
    container_name: siana-bot
    restart: unless-stopped
    # Sans init, dotnet en PID 1 reste figé après un crash au lieu de sortir (et le restart ne joue jamais).
    init: true
    environment:
      DOTNET_ENVIRONMENT: Production
      Discord__Token: ${DISCORD_TOKEN:?set DISCORD_TOKEN before deploying}
      # Rôle « Membre » du serveur INFRES19, donné aux pseudos « Prénom N. ».
      # Nécessite l'intent Server Members activé dans le Developer Portal.
      NicknameConvention__GuildId: "1561647745507528847"
      NicknameConvention__RoleId: "1563195063016628437"
      # Filières DL et SR : réservées aux Membres (les salons INFRES n'ouvrent qu'avec l'une d'elles).
      NicknameConvention__ReservedRoleIds__0: "1563171919547605043"
      NicknameConvention__ReservedRoleIds__1: "1563171987512361170"
      # Logs de modération : le bot crée #logs-moderation (visible des seuls admins) s'il n'existe pas.
      # Nécessite les permissions « Voir les logs du serveur » et « Gérer les salons ».
      ModerationLog__GuildId: "1561647745507528847"
    volumes:
      - siana-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  siana-data:
